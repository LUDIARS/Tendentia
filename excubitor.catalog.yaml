# Excubitor catalog fragment -- Tendentia (Td) owns this service definition.
#
# ポート番号の正本はここだけ (コードには既定値を持たない)。起動・停止は Excubitor 経由で、
# 本体 checkout (${ARS_ROOT}/Tendentia) からだけ行う。worktree からは起動しない。
# 待ち受けは 127.0.0.1。同じ端末からは今まで通り使え、外からは公開 URL (Cloudflare Tunnel) 経由で開く。
#
# 2 つの役割 (2026-10-14 neco「Td は AWS に置きます」「巡回と収集は本社で」):
# - tendentia (collector): 本社で巡回して集める。変更 (設定・巡回・興味) は本社の端末からだけ。
#   公開 URL は tendentia-hq (閲覧だけ誰でも)。viewer はここの GET /api/sync/export から写しを取る。
# - tendentia-viewer: AWS で本社の写しを見せる。巡回もサイトの変更もしない。みんなが開く公開 URL は tendentia。
#   Cernere でログインした人だけ、その人の好み (興味・開いた記録) を記録してマップを変える (spec/feature/personal-login.md)。
# どちらも全公開 (Access なし)。Cloudflare Access を付けたときは JWT が正しい要求だけを通す (team / AUD は
# Excubitor の runtime-config = EXCUBITOR_SERVICE_CONFIG_JSON の cloudflareAccess から受け取る)。
# 公開 Host は Ex の global.env.LUDIARS_ALLOWED_HOSTS も受け取る (ここで上書きしない)。
# LLM は使わない。
services:
  - code: tendentia
    name: Tendentia (トレンドの巡回と収集・本社)
    viewer:
      enabled: true
      entry_path: /
    frontend_url: &tendentia_hq_url https://tendentia-hq${DOMAIN_ROOT}
    tier: personal
    project_code: Td
    component: backend
    port: 4450
    repo: LUDIARS/Tendentia
    runtime: node
    cwd: ${ARS_ROOT}/Tendentia
    # 常駐は事前ビルドした JS を node で直接起動する (tsx は使わない)。
    command: node dist/server.js
    build_command: npm run build
    allow_hot_reload: false
    autostart: false
    restart_policy: on-failure
    max_restart: 5
    log_path: ${ARS_ROOT}/logs/tendentia
    health:
      type: http
      url: http://127.0.0.1:4450/health
      interval_sec: 30
      grace_period_sec: 15
    provides:
      TENDENTIA_URL: http://127.0.0.1:${port}
      # Memoria などが「Tendentia で開く」に使う公開 URL (みんなが見る AWS の viewer)。
      TENDENTIA_PUBLIC_URL: &tendentia_public_url https://tendentia${DOMAIN_ROOT}
    env:
      NODE_ENV: production
      TENDENTIA_ROLE: collector
      TENDENTIA_HOST: 127.0.0.1
      TENDENTIA_PORT: "4450"
      # 自分の公開 URL (https の Origin)。この Host への要求だけを公開の入口として扱う。
      TENDENTIA_SELF_URL: *tendentia_hq_url
      # 巡回の履歴・興味の設定・開いた記録 (tendentia.db)。data/ は .gitignore 済み。
      TENDENTIA_DATA_DIR: ${ARS_ROOT}/Tendentia/data

  - code: tendentia-viewer
    name: Tendentia 閲覧 (本社の写しを見せるだけ・AWS)
    viewer:
      enabled: true
      entry_path: /
    frontend_url: *tendentia_public_url
    tier: saas
    project_code: Td
    component: backend
    port: 4451
    repo: LUDIARS/Tendentia
    runtime: node
    cwd: ${ARS_ROOT}/Tendentia
    command: node dist/server.js
    build_command: npm run build
    allow_hot_reload: false
    autostart: false
    restart_policy: on-failure
    max_restart: 5
    log_path: ${ARS_ROOT}/logs/tendentia-viewer
    health:
      type: http
      url: http://127.0.0.1:4451/health
      interval_sec: 30
      grace_period_sec: 15
    env:
      NODE_ENV: production
      TENDENTIA_ROLE: viewer
      TENDENTIA_HOST: 127.0.0.1
      TENDENTIA_PORT: "4451"
      TENDENTIA_SELF_URL: *tendentia_public_url
      # 写しを取りに行く本社の Tendentia (collector の公開 URL)。
      TENDENTIA_UPSTREAM_URL: *tendentia_hq_url
      # Cernere でのログイン (画面が popup で開く公開 URL)。サーバからの接続先 CERNERE_URL は Cernere の provides から届く。
      # Cernere 側は composite の許可 Origin に https://tendentia.ai-run-do.com を持つ (Cernere migration 064 / catalog)。
      TENDENTIA_CERNERE_PUBLIC_URL: https://cr${DOMAIN_ROOT}
      # 写しの置き場所。同じ checkout で collector と並んでもぶつからないよう data-viewer/ に分ける (.gitignore 済み)。
      TENDENTIA_DATA_DIR: ${ARS_ROOT}/Tendentia/data-viewer
